<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2ede3">
  <meta name="description" content="拾光通讯录：收藏重要联系人，记录多种联系方式，支持 Excel 导入导出。">
  <title>拾光通讯录 · Address Book</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📇</text></svg>">
  <link rel="stylesheet" href="css/style.css?v=1.3.0">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true"><span>拾</span></div>
        <div class="brand-text">
          <span class="brand-name">拾光通讯录</span>
          <span class="brand-sub">ADDRESS BOOK</span>
        </div>
        <div class="brand-total" title="联系人总数">
          <strong id="brand-total">0</strong><span>位</span>
        </div>
      </header>

      <div class="account" id="account"></div>

      <div class="sidebar-actions">
        <button class="btn btn-primary btn-block" type="button" data-action="new">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          新建联系人
          <kbd>N</kbd>
        </button>
        <div class="action-row">
          <button class="btn btn-ghost" type="button" data-action="import">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg>
            导入 Excel
          </button>
          <button class="btn btn-ghost" type="button" data-action="export">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v12m0 0 4.5-4.5M12 16l-4.5-4.5M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg>
            导出 Excel
          </button>
        </div>
      </div>

      <div class="preview-banner" id="preview-banner" hidden></div>

      <div class="searchbox">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="search" type="search" placeholder="搜索姓名、公司或号码" autocomplete="off" aria-label="搜索联系人">
        <kbd>/</kbd>
      </div>

      <div class="filter-row" role="tablist" aria-label="联系人筛选">
        <button class="filter active" type="button" role="tab" aria-selected="true" data-filter="all">
          全部<span class="count" id="count-all">0</span>
        </button>
        <button class="filter" type="button" role="tab" aria-selected="false" data-filter="favorite">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.6 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>
          收藏<span class="count" id="count-favorite">0</span>
        </button>
      </div>

      <div class="list" id="contact-list" aria-live="polite"></div>

      <footer class="sidebar-footer">
        <span class="status-dot" aria-hidden="true"></span>
        <span>数据保存在 SQLite</span>
        <span class="version">v1.0</span>
      </footer>
    </aside>

    <main class="detail" id="detail" aria-live="polite"></main>
  </div>

  <div id="overlay-root"></div>
  <div id="toast-root" class="toast-root" aria-live="assertive" aria-atomic="true"></div>

  <script type="module" src="js/app.js?v=1.2.0"></script>
</body>
</html>
